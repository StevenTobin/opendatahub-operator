kind: ServiceMonitor
apiVersion: monitoring.coreos.com/v1
metadata:
  namespace: {{.Namespace}}
  name: feastoperator-servicemonitor
spec:
  endpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      honorLabels: true
      path: /metrics
      port: https
      tlsConfig:
        insecureSkipVerify: true
      scheme: https
  selector:
    matchLabels:
      app.kubernetes.io/name: feast-operator