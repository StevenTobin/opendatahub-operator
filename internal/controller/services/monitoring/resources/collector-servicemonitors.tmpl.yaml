apiVersion: monitoring.rhobs/v1
kind: ServiceMonitor
metadata:
  name: {{ .OpenTelemetryCollectorName }}-monitor
  namespace: {{ .Namespace }}
spec:
  endpoints:
    - port: monitoring
  namespaceSelector:
    matchNames:
      - {{ .Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: opendatahub.otel
      app.kubernetes.io/managed-by: opentelemetry-operator
      app.kubernetes.io/part-of: opentelemetry
      operator.opentelemetry.io/collector-service-type: monitoring
---
apiVersion: monitoring.rhobs/v1
kind: ServiceMonitor
metadata:
  name: {{ .OpenTelemetryCollectorName }}-prometheusmonitor
  namespace: {{ .Namespace }}
spec:
  endpoints:
    - port: prometheus
  namespaceSelector:
    matchNames:
      - {{ .Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: opendatahub.otel
      app.kubernetes.io/managed-by: opentelemetry-operator
      app.kubernetes.io/part-of: opentelemetry
      operator.opentelemetry.io/collector-service-type: base