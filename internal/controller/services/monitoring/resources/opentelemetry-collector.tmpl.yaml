apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: data-science-collector
  namespace: {{.Namespace}}
spec:
  volumeMounts:
    - name: cabundle-volume
      mountPath: /etc/pki/ca-trust/source/service-ca
      readOnly: true
  volumes:
    - name: cabundle-volume
      configMap:
        name: cabundle
  replicas: {{.CollectorReplicas}}
  mode: statefulset
  targetAllocator:
    enabled: true
    serviceAccount: data-science-collector-collector
    prometheusCR:
      enabled: true
      podMonitorSelector: 
        matchExpressions:
          - key: platform.opendatahub.io/part-of
            operator: In
            values: monitoring
      serviceMonitorSelector: 
        matchLabels:
          platform.opendatahub.io/part-of: monitoring
      probeSelector: 
        matchLabels:
          platform.opendatahub.io/part-of: monitoring
  config:
    extensions:
      bearertokenauth:
        filename: "/var/run/secrets/kubernetes.io/serviceaccount/token"
    receivers:
      {{- if .Metrics }}
      prometheus:
        config:
          scrape_configs:
            - job_name: 'Federate Prometheus'
              scrape_interval: 30s
              scheme: https
              tls_config:
                ca_file: /etc/pki/ca-trust/source/service-ca/service-ca.crt
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              honor_labels: false
              metrics_path: '/federate'
              params:
                'match[]':
                  - '{__name__= "haproxy_backend_http_responses_total"}'
                  - '{__name__= "controller_runtime_reconcile_total"}'
                  - '{__name__= "container_cpu_usage_seconds_total"}'
                  - '{__name__= "container_memory_rss"}'
                  - '{__name__= "kubelet_volume_stats_used_bytes"}'
                  - '{__name__= "kubelet_volume_stats_capacity_bytes"}'
                  - '{__name__= "kube_pod_container_status_waiting_reason"}'
                  - '{__name__= "kube_pod_container_status_restarts_total"}'
                  - '{__name__= "kube_pod_container_status_terminated_reason"}'
                  - '{__name__= "openshift_build_status_phase_total"}'
                  - '{__name__= "kube_statefulset_replicas"}'
              static_configs:
                - targets:
                  - "prometheus-k8s.openshift-monitoring.svc.cluster.local:9091"
            - job_name: 'Llama Stack K8s Operator'
              metrics_path: /metrics
              scheme: https
              tls_config:
                insecure_skip_verify: true
              params:
                module: [http_2xx]
              authorization:
                credentials_file: /run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: service
                  namespaces:
                    names:
                      - {{.Namespace}}
              relabel_configs:
                - action: keep
                  regex: '.*llama-stack-k8s-operator-controller-manager-metrics-service'
                  source_labels: [__address__]
            {{- if .AcceleratorMetrics }}
            - job_name: 'dcgm-exporter-accelerator-metrics'
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - nvidia-gpu-operator
              metrics_path: /metrics
              relabel_configs:
                - action: keep
                  regex: ^nvidia-dcgm-exporter.*$
                  source_labels: [__meta_kubernetes_pod_name]
                - action: replace
                  regex: '([^:]+)(?::\d+)?'
                  replacement: '$1:9400'
                  source_labels: [__address__]
                  target_label: __address__
                - action: replace
                  source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
                - action: replace
                  regex: 'DCGM_FI_DEV_GPU_TEMP'
                  replacement: 'nvidia_gpu_temperature_celsius'
                  source_labels: [__name__]
                  target_label: __name__
                - action: replace
                  regex: 'DCGM_FI_DEV_GPU_UTIL'
                  replacement: 'nvidia_gpu_utilization_ratio'
                  source_labels: [__name__]
                  target_label: __name__
                - action: replace
                  regex: 'DCGM_FI_DEV_MEM_COPY_UTIL'
                  replacement: 'nvidia_gpu_memory_utilization_ratio'
                  source_labels: [__name__]
                  target_label: __name__
                - action: replace
                  regex: 'DCGM_FI_DEV_FB_USED'
                  replacement: 'nvidia_gpu_memory_used_bytes'
                  source_labels: [__name__]
                  target_label: __name__
                - action: replace
                  regex: 'DCGM_FI_DEV_FB_FREE'
                  replacement: 'nvidia_gpu_memory_free_bytes'
                  source_labels: [__name__]
                  target_label: __name__
                - action: replace
                  regex: 'DCGM_FI_DEV_POWER_USAGE'
                  replacement: 'nvidia_gpu_power_usage_watts'
                  source_labels: [__name__]
                  target_label: __name__
                - action: replace
                  regex: 'DCGM_FI_DEV_SM_CLOCK'
                  replacement: 'nvidia_gpu_sm_clock_mhz'
                  source_labels: [__name__]
                  target_label: __name__
                - action: replace
                  regex: 'DCGM_FI_DEV_MEM_CLOCK'
                  replacement: 'nvidia_gpu_memory_clock_mhz'
                  source_labels: [__name__]
                  target_label: __name__
                - action: replace
                  source_labels: [__meta_kubernetes_pod_label_app]
                  target_label: component
                - action: replace
                  replacement: 'rhoai-accelerator-metrics'
                  target_label: job
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: 'DCGM_FI_DEV_GPU_UTIL|DCGM_FI_DEV_MEM_COPY_UTIL'
                  action: drop
                # Convert DCGM percentage metrics to ratios (0-1 scale) for OCP compatibility
                - source_labels: [__name__]
                  regex: 'nvidia_gpu_(utilization|memory_utilization)_ratio'
                  target_label: __tmp_scale_needed
                  replacement: 'true'
                - source_labels: [__name__]
                  regex: '(nvidia_gpu_temperature_celsius|nvidia_gpu_utilization_ratio|nvidia_gpu_memory_utilization_ratio|nvidia_gpu_memory_used_bytes|nvidia_gpu_memory_free_bytes|nvidia_gpu_power_usage_watts|nvidia_gpu_sm_clock_mhz|nvidia_gpu_memory_clock_mhz|DCGM_FI_DEV_GPU_TEMP|DCGM_FI_DEV_FB_USED|DCGM_FI_DEV_FB_FREE|DCGM_FI_DEV_POWER_USAGE|DCGM_FI_DEV_SM_CLOCK|DCGM_FI_DEV_MEM_CLOCK)'
                  action: keep
              scrape_interval: 30s
              scrape_timeout: 10s
              tls_config:
                insecure_skip_verify: true
            {{- end }}
      {{- end }}
      otlp:
        protocols:
          grpc: {}
          http: {}
    processors:
      memory_limiter:
        check_interval: 1s
        spike_limit_mib: 800
        limit_mib: 4000
      batch:
        send_batch_size: 10000
      k8sattributes: {}
      resourcedetection:
        detectors: [openshift]
    exporters:
      debug:
        verbosity: detailed
      {{- if .Metrics }}
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true # by default resource attributes are dropped
      {{- if .MetricsExporterNames }}
      {{- range .MetricsExporterNames }}
      {{ . }}:
{{ index $.MetricsExporters . | indent 8 }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if .Traces }}
      otlp/tempo:
        endpoint: {{.TempoEndpoint}}
        {{- if .TempoTLSEnabled }}
        tls:
          ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
        auth:
          authenticator: bearertokenauth
        {{- else }}
        tls:
          insecure: true
        {{- end }}
        headers:
          # must be set to the tenant name from tempo CR
          X-Scope-OrgID: {{ .Namespace }}
      {{- if .TracesExporterNames }}
      {{- range .TracesExporterNames }}
      {{ . }}:
{{ index $.TracesExporters . | indent 8 }}
      {{- end }}
      {{- end }}
      {{ end }}
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: '0.0.0.0'
                    port: 8888
      extensions: [bearertokenauth]
      {{- if or .Traces .Metrics }}
      pipelines:
      {{- if .Traces }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp/tempo{{- if .TracesExporterNames }}{{- range .TracesExporterNames }}, {{ . }}{{- end }}{{- end }}]
      {{ end }}
      {{ if .Metrics }}
        metrics:
          receivers: [prometheus, otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [prometheus{{- if .MetricsExporterNames }}{{- range .MetricsExporterNames }}, {{ . }}{{- end }}{{- end }}]
      {{- end }}
      {{- end }}
